[project]
name = "breakout-nstep-ddqn"
version = "0.1.0"
description = "N-step Double DQN vs. 1-step DQN and Double DQN baselines on Atari Breakout (RAM observations)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ale-py>=0.12.1",
    "gymnasium[atari]>=1.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "structlog>=26.1.0",
    "tensorboard>=2.21.0",
    "torch>=2.15.0",
    "tyro>=1.0.16",
    "wandb>=0.31.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
